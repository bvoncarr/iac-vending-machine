name: IaC Vending Machine

on:
  pull_request:
    paths:
      - 'requests/**.yaml'
  push:
    branches:
      - main
    paths:
      - 'requests/**.yaml'
      - 'main.tf'
      - 'modules/**'

jobs:
  validate:
    name: Validate Request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          for file in requests/*.yaml; do
            grep -q "resource:" "$file" || { echo "Missing resource in $file"; exit 1; }
            grep -q "name:" "$file" || { echo "Missing name in $file"; exit 1; }
            grep -q "team:" "$file" || { echo "Missing team tag in $file"; exit 1; }
            echo "✅ $file valid"
          done

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan -no-color \
            -var="client_id=${{ secrets.ARM_CLIENT_ID }}" \
            -var="client_secret=${{ secrets.ARM_CLIENT_SECRET }}" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.ARM_TENANT_ID }}"

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="client_id=${{ secrets.ARM_CLIENT_ID }}" \
            -var="client_secret=${{ secrets.ARM_CLIENT_SECRET }}" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.ARM_TENANT_ID }}"
